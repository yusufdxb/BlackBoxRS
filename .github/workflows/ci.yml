name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check

      - name: Unit + integration tests
        # rclpy-gated integration tests auto-skip on runners that do
        # not have ROS 2 installed (which GitHub hosted runners don't).
        # The pytest.ini addopts already disables ROS pytest plugins
        # so no extra configuration is needed here.
        run: |
          python -m pytest -q

      - name: Detector characteristics (smoke)
        # Exercises scripts/measure_detector_fpr.py so the FPR/TPR harness
        # stays alive. No regression gate yet; just verify it runs.
        run: |
          python scripts/measure_detector_fpr.py --hours 1 --json-output artifacts/detector_characteristics.json

  replay-lab:
    name: Replay Lab (golden cases + determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Replay Lab tests (unit, faults, invariants, golden cases, determinism, fixtures)
        # No ROS, robot or network needed. test_helix_parity skips here: it
        # needs a HELIX checkout (HELIX_SRC), which is a separate repository.
        run: |
          python -m pytest -q tests/unit/lab

      - name: Golden cases through the CLI, three identical replays each
        run: |
          mkdir -p artifacts
          robot-blackbox lab verify examples/replay_lab/cases --repeat 3 \
            --json artifacts/replay_lab_verify.json

      - name: Same results under different hash seeds (all cases)
        run: |
          PYTHONHASHSEED=0 robot-blackbox lab verify --repeat 1 --json artifacts/seed0.json
          PYTHONHASHSEED=987 robot-blackbox lab verify --repeat 1 --json artifacts/seed987.json
          python - <<'PY'
          import json
          a = json.load(open("artifacts/seed0.json"))["cases"]
          b = json.load(open("artifacts/seed987.json"))["cases"]
          da = {c["case"]: c["result_sha256"] for c in a}
          db = {c["case"]: c["result_sha256"] for c in b}
          assert da == db, sorted(k for k in da if da[k] != db.get(k))
          for k in sorted(da):
              print(da[k][:16], k)
          PY

      - name: Upload Replay Lab summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: replay-lab-verify-py${{ matrix.python-version }}
          path: artifacts/

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark suite
        run: |
          python scripts/benchmark.py --json-output artifacts/benchmark-results.json

      - name: Enforce benchmark thresholds
        run: |
          python scripts/check_benchmark_regressions.py \
            --results artifacts/benchmark-results.json \
            --baseline scripts/benchmark_baseline.json \
            --thresholds scripts/benchmark_thresholds.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: artifacts/benchmark-results.json

  ros-live:
    name: ROS live verification (Docker Humble)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Build Humble image
        run: |
          docker build -f docker/Dockerfile.humble -t blackboxrs:humble-ci .

      - name: Run live ROS integration test
        run: |
          docker run --rm --init \
            -e ROS_LOCALHOST_ONLY=1 \
            blackboxrs:humble-ci \
            python3 -m pytest -q \
              tests/integration/test_ros_live.py \
              tests/integration/test_observer_live.py
