name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check

      - name: Unit + integration tests
        # rclpy-gated integration tests auto-skip on runners that do
        # not have ROS 2 installed (which GitHub hosted runners don't).
        # The pytest.ini addopts already disables ROS pytest plugins
        # so no extra configuration is needed here.
        run: |
          python -m pytest -q

      - name: Detector characteristics (smoke)
        # Exercises scripts/measure_detector_fpr.py so the FPR/TPR harness
        # stays alive. No regression gate yet; just verify it runs.
        run: |
          python scripts/measure_detector_fpr.py --hours 1 --json-output artifacts/detector_characteristics.json

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark suite
        run: |
          python scripts/benchmark.py --json-output artifacts/benchmark-results.json

      - name: Enforce benchmark thresholds
        run: |
          python scripts/check_benchmark_regressions.py \
            --results artifacts/benchmark-results.json \
            --baseline scripts/benchmark_baseline.json \
            --thresholds scripts/benchmark_thresholds.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: artifacts/benchmark-results.json

  ros-live:
    name: ROS live verification (Docker Humble)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build Humble image
        run: |
          docker build -f docker/Dockerfile.humble -t blackboxrs:humble-ci .

      - name: Run live ROS integration test
        run: |
          docker run --rm --init \
            -e ROS_LOCALHOST_ONLY=1 \
            blackboxrs:humble-ci \
            python3 -m pytest -q tests/integration/test_ros_live.py
