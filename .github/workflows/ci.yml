name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check

      - name: Unit + integration tests
        # rclpy-gated integration tests auto-skip on runners that do
        # not have ROS 2 installed (which GitHub hosted runners don't).
        # The pytest.ini addopts already disables ROS pytest plugins
        # so no extra configuration is needed here.
        run: |
          python -m pytest -q

      - name: Detector characteristics (smoke)
        # Exercises scripts/measure_detector_fpr.py so the FPR/TPR harness
        # stays alive. No regression gate yet; just verify it runs.
        run: |
          python scripts/measure_detector_fpr.py --hours 1 --json-output artifacts/detector_characteristics.json

  benchmark:
    name: Benchmark regression gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark suite
        run: |
          python scripts/benchmark.py --json-output artifacts/benchmark-results.json

      - name: Enforce benchmark thresholds
        run: |
          python scripts/check_benchmark_regressions.py \
            --results artifacts/benchmark-results.json \
            --baseline scripts/benchmark_baseline.json \
            --thresholds scripts/benchmark_thresholds.json

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: artifacts/benchmark-results.json

  ros-live:
    name: ROS live verification (Docker Humble)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Build Humble production and CI images
        run: |
          docker build --target ci -f docker/Dockerfile.humble -t blackboxrs:humble-ci .
          docker build -f docker/Dockerfile.humble -t blackboxrs:humble-production-ci .

      - name: Verify production image and installed native recorder
        run: |
          docker run --rm blackboxrs:humble-production-ci \
            /bin/bash -c '
              set -euo pipefail
              prefix="$(ros2 pkg prefix blackbox_capture_cpp)"
              test "$prefix" = /opt/blackboxrs/native_install
              executables="$(ros2 pkg executables blackbox_capture_cpp)"
              for executable in blackbox_capture blackbox_capture_recover blackbox_capture_export_rosbag2; do
                grep -Fx "blackbox_capture_cpp $executable" <<<"$executables"
                binary="$prefix/lib/blackbox_capture_cpp/$executable"
                if ! dependencies="$(ldd "$binary" 2>&1)"; then
                  printf "%s\n" "$dependencies" >&2
                  exit 1
                fi
                if grep -F "not found" <<<"$dependencies"; then
                  exit 1
                fi
              done
              test ! -e /opt/blackboxrs/tests
              test ! -e /opt/blackboxrs/scripts/native_capture_bag_gate.py
              test ! -e /opt/blackboxrs/scripts/container_native_daemon_smoke.py
              test ! -e /opt/blackboxrs/examples/bags/go2_sim_odom_imu.mcap
              if command -v ruff >/dev/null 2>&1; then
                echo "ruff leaked into the production image" >&2
                exit 1
              fi
              python3 -c "import blackboxrs, mcap"
            '

      - name: Run live ROS integration test
        run: |
          docker run --rm --init \
            -e ROS_LOCALHOST_ONLY=1 \
            blackboxrs:humble-ci \
            python3 -m pytest -q \
              tests/integration/test_ros_live.py \
              tests/integration/test_observer_live.py

      - name: Prove daemon-owned native lifecycle from production image
        run: |
          mkdir -p artifacts/native_container_daemon
          docker run --rm --init \
            -e ROS_LOCALHOST_ONLY=1 \
            -e ROS_DOMAIN_ID=82 \
            -e RMW_IMPLEMENTATION=rmw_fastrtps_cpp \
            -v "$PWD/artifacts/native_container_daemon:/root/.blackboxrs" \
            -v "$PWD/scripts/container_native_daemon_smoke.py:/proof/container_native_daemon_smoke.py:ro" \
            blackboxrs:humble-production-ci \
            python3 /proof/container_native_daemon_smoke.py \
              --output-root /root/.blackboxrs \
              --report /root/.blackboxrs/container_native_daemon_smoke.json

      - name: Prove native fidelity from shipping image
        run: |
          mkdir -p artifacts
          for gate_spec in "rmw_fastrtps_cpp:83" "rmw_cyclonedds_cpp:84"; do
            gate_rmw="${gate_spec%%:*}"
            gate_domain="${gate_spec##*:}"
            docker run --rm --init \
              -e ROS_LOCALHOST_ONLY=1 \
              -e ROS_DOMAIN_ID="$gate_domain" \
              -e RMW_IMPLEMENTATION="$gate_rmw" \
              -v "$PWD/artifacts:/artifacts" \
              -v "$PWD/scripts/native_capture_bag_gate.py:/proof/native_capture_bag_gate.py:ro" \
              -v "$PWD/examples/bags/go2_sim_odom_imu.mcap:/proof/go2_sim_odom_imu.mcap:ro" \
              blackboxrs:humble-production-ci \
              python3 /proof/native_capture_bag_gate.py \
                --bag /proof/go2_sim_odom_imu.mcap \
                --report "/artifacts/native_container_bag_gate_${gate_rmw}.json"
          done

      - name: Upload shipping-image native proofs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-container-proof
          path: |
            artifacts/native_container_bag_gate_*.json
            artifacts/native_container_daemon/container_native_daemon_smoke.json

  native-build:
    name: Native build + GoogleTest (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            python3-colcon-common-extensions \
            ros-humble-ament-cmake-gtest \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-mcap-vendor \
            ros-humble-rclcpp-components \
            ros-humble-std-msgs
          rm -rf /var/lib/apt/lists/*

      - name: Build native packages
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-up-to blackbox_capture_cpp blackbox_capture_bench \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Run native tests
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test \
            --packages-select blackbox_capture_cpp blackbox_capture_bench \
            --event-handlers console_direct+
          colcon test-result --verbose

  native-sanitizers:
    name: Native ${{ matrix.sanitizer }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: ASan
            cmake_option: BLACKBOX_CAPTURE_ENABLE_ASAN
          - sanitizer: UBSan
            cmake_option: BLACKBOX_CAPTURE_ENABLE_UBSAN

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install sanitizer dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            python3-colcon-common-extensions \
            ros-humble-ament-cmake-gtest \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-mcap-vendor \
            ros-humble-rclcpp-components \
            ros-humble-std-msgs
          rm -rf /var/lib/apt/lists/*

      - name: Build instrumented native tests
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-select blackbox_capture_cpp \
            --event-handlers console_direct+ \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -D${{ matrix.cmake_option }}=ON

      - name: Run instrumented native tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test \
            --packages-select blackbox_capture_cpp \
            --event-handlers console_direct+
          colcon test-result --verbose

  native-format:
    name: Native formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container: ros:humble-ros-base

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install formatter
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-humble-ament-uncrustify
          rm -rf /var/lib/apt/lists/*

      - name: Check native formatting
        run: |
          . /opt/ros/humble/setup.sh
          ament_uncrustify src/blackbox_capture_cpp src/blackbox_capture_bench

  native-fuzz-smoke:
    name: Native libFuzzer build + smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: ros:humble-ros-base

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install fuzz build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang \
            python3-colcon-common-extensions \
            ros-humble-mcap-vendor \
            ros-humble-rclcpp-components \
            ros-humble-std-msgs
          rm -rf /var/lib/apt/lists/*

      - name: Build fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-select blackbox_capture_cpp \
            --event-handlers console_direct+ \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=OFF \
              -DBLACKBOX_CAPTURE_BUILD_FUZZERS=ON

      - name: Run bounded fuzz smoke
        run: |
          for target in segment_parser event_decoder topic_metadata; do
            build/blackbox_capture_cpp/fuzz_${target} -runs=100
          done

  native-integration:
    name: Native ROS + Python interoperability + benchmark smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ros:humble-ros-base
    env:
      ROS_LOCALHOST_ONLY: "1"
      # Pinned rather than left to the container default. This job runs
      # several ros2 capture cycles back to back with almost no settle time,
      # and the default Fast DDS build loses the delivery-count race between
      # consecutive runs, which surfaces as an unexplained reconciliation
      # failure rather than as a discovery error.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install integration dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-ament-cmake-gtest \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-mcap-vendor \
            ros-humble-rclcpp-components \
            ros-humble-rmw-cyclonedds-cpp \
            ros-humble-std-msgs
          rm -rf /var/lib/apt/lists/*
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir -e ".[dev,replay]"
          python3 -m pip install --no-cache-dir "jsonschema>=4.0"

      - name: Build native packages
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-up-to blackbox_capture_cpp blackbox_capture_bench \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON

      - name: Run native Python reader tests
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          python3 -m pytest -q -k native_capture

      - name: Run live native benchmark smoke
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          python3 scripts/native_capture_benchmark.py \
            --scenario custom \
            --topics 2 \
            --rate 200 \
            --payload-bytes 256 \
            --duration-sec 3 \
            --discovery-warmup-sec 1 \
            --output artifacts/native_capture_smoke.json

      - name: Validate smoke artifact contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate

          result = json.loads(Path("artifacts/native_capture_smoke.json").read_text())
          schema = json.loads(Path("scripts/native_capture_benchmark.schema.json").read_text())
          validate(result, schema)
          assert result["schema_version"] == "blackboxrs.capture_benchmark.v1"
          assert result["validity"]["valid"], result["validity"]["errors"]
          assert result["counters"]["sent"] > 0
          assert result["counters"]["received"] is not None
          assert result["counters"]["committed"] is not None
          assert result["counters"]["serialized_committed"] > 0
          assert result["counters"]["dropped"] is not None
          assert result["counters"]["received"] == (
              result["counters"]["committed"] + result["counters"]["dropped"]
          )
          assert result["capture_quality"]["clean"] is True
          assert result["lifecycle"]["final_status_state"] == "STOPPED_CLEAN"
          assert result["lifecycle"]["forced_shutdown"] is False
          PY

      - name: Run shortened long-run tooling smoke
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          python3 scripts/native_capture_long_run.py \
            --allow-short \
            --duration-sec 3 \
            --post-warmup-sec 1 \
            --topics 2 \
            --rate 200 \
            --payload-bytes 256 \
            --output artifacts/native_capture_long_run_smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate

          result = json.loads(Path("artifacts/native_capture_long_run_smoke.json").read_text())
          schema = json.loads(Path("scripts/native_capture_long_run.schema.json").read_text())
          validate(result, schema)
          assert result["schema_version"] == "blackboxrs.capture_long_run.v1"
          assert result["benchmark"]["validity"]["valid"]
          assert result["benchmark"]["lifecycle"]["final_status_state"] == "STOPPED_CLEAN"
          assert result["stability"]["trend"] == "inconclusive"
          assert result["stability"]["sample_count"] > 0
          PY

      - name: Run deterministic storage-fault smoke
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          python3 scripts/native_capture_benchmark.py \
            --scenario custom \
            --topics 1 \
            --rate 200 \
            --payload-bytes 256 \
            --duration-sec 1 \
            --discovery-warmup-sec 1 \
            --fail-after-bytes 4096 \
            --expect-storage-fault \
            --output artifacts/native_capture_storage_fault_smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate

          result = json.loads(
              Path("artifacts/native_capture_storage_fault_smoke.json").read_text()
          )
          schema = json.loads(Path("scripts/native_capture_benchmark.schema.json").read_text())
          validate(result, schema)
          assert result["validity"]["valid"], result["validity"]["errors"]
          assert result["storage"]["errors"] > 0
          assert result["lifecycle"]["final_status_state"] != "STOPPED_CLEAN"
          assert result["counters"]["durable"] is None
          assert result["storage"]["partial_segments"] > 0 or result["storage"]["segments"] > 0
          PY

      - name: Upload native benchmark smoke artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-capture-smoke
          path: |
            artifacts/native_capture_smoke.json
            artifacts/native_capture_long_run_smoke.json
            artifacts/native_capture_storage_fault_smoke.json

  native-bag-fidelity:
    name: Native bag fidelity (${{ matrix.label }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: ros:humble-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Fast DDS
            rmw: rmw_fastrtps_cpp
            domain_id: "81"
          - label: Cyclone DDS
            rmw: rmw_cyclonedds_cpp
            domain_id: "82"
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: ${{ matrix.domain_id }}
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Install native bag dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-geometry-msgs \
            ros-humble-mcap-vendor \
            ros-humble-nav-msgs \
            ros-humble-rmw-cyclonedds-cpp \
            ros-humble-rmw-fastrtps-cpp \
            ros-humble-rosbag2 \
            ros-humble-rosbag2-storage-mcap \
            ros-humble-rclcpp-components \
            ros-humble-sensor-msgs \
            ros-humble-std-msgs
          rm -rf /var/lib/apt/lists/*
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir -e ".[replay]"

      - name: Build installed native recorder
        run: |
          . /opt/ros/humble/setup.sh
          colcon build \
            --packages-select blackbox_capture_cpp \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF

      - name: Replay committed bag and prove native payload fidelity
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          python3 scripts/native_capture_bag_gate.py \
            --report artifacts/native_bag_gate_${{ matrix.rmw }}.json

      - name: Upload native bag fidelity artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-bag-fidelity-${{ matrix.rmw }}
          path: artifacts/native_bag_gate_${{ matrix.rmw }}.json
