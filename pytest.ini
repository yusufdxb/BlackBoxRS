[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Disable host ROS pytest plugins by their pytest11 entry-point names.
# These plugins are auto-loaded when /opt/ros/<distro>/setup.bash has been
# sourced and break pytest collection in this project (notably
# launch_ros, which references the obsolete pytest_launch_collect_makemodule
# hook).  Disable them so `pytest` works inside a sourced ROS shell.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_xmllint
    -p no:ament_lint
