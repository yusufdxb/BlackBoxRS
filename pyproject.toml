[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboxrs"
version = "0.1.0"
description = "Flight recorder for ROS 2 robots"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Yusuf Guenena", email = "yusuf.a.guenena@gmail.com" },
]
keywords = ["ros2", "robotics", "monitoring", "observability", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ros = []
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
robot-blackbox = "blackboxrs.cli.app:cli"

[project.urls]
Homepage = "https://github.com/yusufdxb/BlackBoxRS"
Repository = "https://github.com/yusufdxb/BlackBoxRS"
Issues = "https://github.com/yusufdxb/BlackBoxRS/issues"

[tool.setuptools.packages.find]
include = ["blackboxrs*"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Pytest configuration lives in pytest.ini so the test path stays
# robust when /opt/ros/<distro>/setup.bash has been sourced (we have to
# disable the launch_ros pytest11 entry point there, and pytest.ini is
# the place pytest reads addopts from before any other config).
