[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboxrs"
version = "0.4.1"
description = "Incident intelligence and prevention for ROS 2 robots."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Yusuf Guenena", email = "yusuf.a.guenena@gmail.com" },
]
keywords = [
    "ros2",
    "robotics",
    "incident-response",
    "observability",
    "postmortem",
    "preflight",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# NOTE: there is deliberately no `ros` extra.  `rclpy` is installed
# from the system apt package (e.g. `ros-humble-rclpy`), not from
# PyPI, because the ROS 2 Python client library is tightly coupled to
# the ROS 2 distro that ships with it.  See docker/Dockerfile.humble
# for the verified install path.
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
prometheus = [
    "prometheus_client>=0.17",
]
# Offline replay of recorded rosbag2 .mcap files through the detectors
# (blackboxrs.recording.bag_replay).  Reads only topic + timestamp, so it
# needs the storage reader but none of the ROS message packages.
replay = [
    "mcap>=1.0",
]

[project.scripts]
robot-blackbox = "blackboxrs.cli.app:cli"

[project.urls]
Homepage = "https://github.com/yusufdxb/BlackBoxRS"
Repository = "https://github.com/yusufdxb/BlackBoxRS"
Issues = "https://github.com/yusufdxb/BlackBoxRS/issues"

[tool.setuptools.packages.find]
include = ["blackboxrs*"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Pytest configuration lives in pytest.ini so the test path stays
# robust when /opt/ros/<distro>/setup.bash has been sourced (we have to
# disable the launch_ros pytest11 entry point there, and pytest.ini is
# the place pytest reads addopts from before any other config).
